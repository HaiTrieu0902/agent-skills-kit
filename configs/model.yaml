# Model configuration for Raffles IT Kit agents

defaults:
  model: claude-sonnet-4-6
  max_tokens: 8192
  temperature: 0

overrides:
  orchestrator:
    model: claude-opus-4-8
  code-archaeologist:
    model: claude-opus-4-8
  security-auditor:
    model: claude-opus-4-8
  database-architect:
    model: claude-opus-4-8
  debugger:
    model: claude-opus-4-8
  project-planner:
    model: claude-opus-4-8
  ai-engineer:
    model: claude-opus-4-8
  data-engineer:
    model: claude-opus-4-8

available_models:
  - id: claude-fable-5
    description: Newest-generation model
  - id: claude-opus-4-8
    description: Most capable — complex orchestration and deep reasoning
  - id: claude-sonnet-4-6
    description: Balanced — default for most agents
  - id: claude-haiku-4-5-20251001
    description: Fast — use for simple, high-frequency tasks
